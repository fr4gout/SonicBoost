# SonicBoost CI / release pipeline
#  • push to main / pull request  → test + build, installers uploaded as a workflow artifact
#  • push a tag  vX.Y.Z           → test + build + publish a GitHub Release with both installers
#  • manual run (Actions tab)     → test + build
name: Build Windows installer

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to create the GitHub Release

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read app version
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "App version: $v"

      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $app = "${{ steps.version.outputs.version }}"
          $cargo = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          $npm = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($tag -ne $app -or $tag -ne $cargo -or $tag -ne $npm) {
            Write-Error "Version mismatch: tag=$tag tauri.conf=$app Cargo.toml=$cargo package.json=$npm. Run .\release.ps1 -Version $tag"
            exit 1
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install npm packages
        run: npm install --no-fund --no-audit

      - name: Unit tests (DSP, analyzer, ring buffer)
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Build installers
        run: npx tauri build

      - name: Upload installers (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: SonicBoost-${{ steps.version.outputs.version }}-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Extract release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $text = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($text, "(?ms)^## \[$([regex]::Escape($v))\][^\n]*\n(.*?)(?=^## \[|^\[[^\]]+\]: |\z)")
          $notes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "SonicBoost $v" }
          $notes += "`n`n---`n**Install:** download ``SonicBoost_${v}_x64-setup.exe`` below. First time? See the [one-time audio setup](https://github.com/${{ github.repository }}#-installation)."
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: SonicBoost v${{ steps.version.outputs.version }}
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
